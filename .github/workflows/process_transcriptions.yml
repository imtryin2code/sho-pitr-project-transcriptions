name: Process New Transcriptions

on:
  push:
    paths:
      - '6**-S*/**'
      - 'scripts/**'
      - 'metadata/**'
    branches:
      - main

jobs:
  update-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx fpdf2

      - name: Run Processing Pipeline
        run: |
          # 1. Extract raw data
          python scripts/extract_transcriptions.py
          
          # 2. Generate researcher exports (PDF/Word/MD)
          python scripts/generate_reading_guides.py
          
          # 3. Update data structures
          python scripts/update_glossary.py
          
          # 4. Sync the repository's main README profile
          python scripts/update_main_readme.py
          
          # 5. Rebuild the website index.html
          python scripts/update_web_page.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all potential changes
          git add metadata/ exports/ docs/index.html README.md
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Transcriptions, Glossary, Readme, and Webpage [skip ci]" && git push)