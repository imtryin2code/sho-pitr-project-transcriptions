name: Process New Transcriptions

on:
  push:
    paths:
      - '6**-S*/**'
      - 'scripts/**'
      - 'metadata/**'
    branches:
      - main

jobs:
  update-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx fpdf2

      - name: Run Processing Pipeline
        run: |
          # 1. Extract raw data from ELAN
          python scripts/extract_transcriptions.py
          
          # 2. Extract research notes from [brackets]
          python scripts/extract_research_notes.py
          
          # 3. Generate Reading Guides (PDF/MD/DOCX)
          python scripts/generate_reading_guides.py
          
          # 4. Update Glossary & Concordance
          python scripts/update_glossary.py
          
          # 5. Update the Main README (Stats & Research Section)
          python scripts/update_main_readme.py
          
          # 6. Rebuild the website
          python scripts/update_web_page.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add metadata/ exports/ docs/index.html README.md
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Research Log and Archive [skip ci]" && git push)